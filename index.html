<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cour Suprême – Gestion des amendes</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#1c1b22;--mut:#6b6a75;--ac:#7a1f2b;--ac2:#b8923a;--bd:#ddd6c8;--ok:#2f7d4f;--warn:#c27a10;--ko:#b3261e;--hd:#7a1f2b;--onac:#fff}
:root[data-theme=dark]{--bg:#0d1424;--card:#151e33;--tx:#ebe6d6;--mut:#98a2b8;--ac:#d4af37;--ac2:#a88a2e;--bd:#26324d;--ok:#5cc48a;--warn:#e3a64a;--ko:#f0807a;--hd:#14213d;--onac:#1a1405}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Georgia,'Times New Roman',serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--hd);color:#fff;flex-wrap:wrap;border-bottom:3px solid var(--ac2)}
header h1{font-size:20px;margin:0;flex:1}header button{background:#ffffff22;color:#fff;border:1px solid #fff5;border-radius:6px;padding:6px 10px;cursor:pointer}
#sync{font-size:12px;opacity:.9}
nav{display:flex;gap:4px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd);overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{background:none;border:0;color:var(--mut);padding:8px 12px;cursor:pointer;font:inherit;border-radius:6px;white-space:nowrap}
nav button.on{background:var(--ac);color:var(--onac)}
main{max-width:1100px;margin:0 auto;padding:20px}
h2{margin-top:0;color:var(--ac);border-bottom:2px solid var(--ac2);padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.stat b{display:block;font-size:26px;color:var(--ac)}.stat span{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px}input[type=checkbox]{width:auto}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{background:var(--ac);color:var(--onac);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit;margin-top:12px}
.btn.s{padding:3px 8px;margin:0;font-size:13px}.btn.g{background:var(--mut);color:var(--onac)}.btn.d{background:var(--ko);color:var(--onac)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px;vertical-align:top}
th{color:var(--mut);font-weight:600}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--bd)}
.tag.b{background:#2a5db0;color:#fff}
.tag.ap{background:#5b3a99;color:#fff}.apH{background:repeating-linear-gradient(45deg,#ffffffb0 0 3px,transparent 3px 6px)}.tag.ok{background:var(--ok);color:var(--onac)}.tag.ko{background:var(--ko);color:var(--onac)}.tag.w{background:var(--warn);color:var(--onac)}
.bar{height:10px;background:var(--ac2);border-radius:5px}.mut{color:var(--mut)}
.toast{position:fixed;bottom:84px;right:16px;background:var(--ok);color:#fff;padding:10px 16px;border-radius:8px;z-index:100;max-width:420px}
#main{padding-bottom:90px}
#selbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--ac);padding:10px 16px;display:none;gap:12px;align-items:center;flex-wrap:wrap;z-index:50;box-shadow:0 -4px 12px rgba(0,0,0,.18)}
#selbar.on{display:flex}#selbar .btn{margin:0}
.ro td select,.ro td input,.ro td textarea,.ro td .btn{pointer-events:none;opacity:.55}

.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.dlg{width:min(460px,100%);background:var(--card);color:var(--tx);border:1px solid var(--bd);border-top:4px solid var(--ac2);border-radius:12px;padding:20px;box-shadow:0 12px 40px #0007;max-height:90vh;overflow:auto}
.dlg h3{margin:0 0 8px;color:var(--ac)}.dlg p{white-space:pre-line;margin:0 0 12px}
.dlg .ac{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.dlg .btn{margin:0}
.dlg.danger{border-top-color:var(--ko)}.dlg.danger h3{color:var(--ko)}
.dlg .cd{font:600 20px monospace;letter-spacing:1px;background:var(--bg);border:1px dashed var(--ac2);padding:10px;border-radius:8px;text-align:center;user-select:all;margin:0 0 12px;word-break:break-all}
.dlg .er{color:var(--ko);font-size:13px;margin-top:6px;min-height:1em}
#seal{position:fixed;left:50%;top:50%;width:min(74vmin,680px);height:auto;transform:translate(-50%,-50%);opacity:.09;pointer-events:none;user-select:none;z-index:4;mix-blend-mode:multiply}
:root[data-theme=dark] #seal{opacity:.06;mix-blend-mode:normal}
[hidden]{display:none!important}
.ann{display:flex;gap:10px;align-items:center;justify-content:center;padding:8px 14px;background:#fff7dc;color:#5a4300;border-bottom:2px solid var(--ac2);font-size:14px}
:root[data-theme=dark] .ann{background:#2a2410;color:#f0dca0}
.ann button{background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:inherit}
.logbox{max-width:430px;margin:18px auto 0;text-align:center}
.logbox .seal{width:128px;height:128px;border-radius:50%;box-shadow:0 0 0 4px var(--ac2),0 0 0 7px var(--card),0 0 0 8px var(--ac2);margin:10px 0 18px}
.logbox h1{margin:0;color:var(--ac2);font-size:30px;letter-spacing:.5px}
.card.logc{border:2px solid var(--ac2);box-shadow:0 0 0 5px var(--card),0 0 0 7px var(--hd)}
.pw{position:relative}.pw input{padding-right:44px}
.pw .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:18px;color:var(--mut)}
nav:empty{display:none}

.mls{position:absolute;left:0;right:0;top:100%;z-index:50;max-height:280px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px #0004;margin-top:2px}
.mli{padding:7px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:baseline}.mli:hover,.mli.hi{background:var(--bg)}
.mlh{padding:6px 12px 2px;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.mlrow{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin-top:6px;background:var(--card)}
.mlrow .nm{flex:1;min-width:0}.mlrow .pr{font-weight:700;white-space:nowrap}.mlrow input{max-width:130px;margin:0}
.mltot{display:flex;justify-content:space-between;padding:10px;margin-top:8px;border-top:2px solid var(--ac2);font-weight:700}
</style>
</head>
<body>
<header><h1 id="ttl">⚖ Cour Suprême</h1><span id="sync"></span><span id="who"></span><button id="bsync" onclick="pull(true)">⟳ Synchroniser</button><button onclick="toggleTheme()" id="thm">🌙 Nuit</button><button id="prof" onclick="myProfile()" style="display:none">Mon profil</button><button id="bcode" onclick="myCode()">Mon code</button><button id="stp" onclick="pickStamp(sessionStorage.cs_login)">Mon tampon</button><button id="bout" onclick="logout()">Déconnexion</button></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="selbar"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ST=['En attente',"En cours d'instruction",'Accepté','Rejetée'],LEG={'En audience':ST[1],'Acceptée':'Accepté','Réduite':'Accepté'};
const nk=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
const pk=(n,d)=>nk(n)+(d?'|'+d:''),pkf=f=>pk(f.offender,f.dob),dcase=(n,d)=>'d'+hash(pk(n,d));
function caseFor(n,d){const k=pk(n,d),did=dcase(n,d);
  let x=db.cases.find(c=>c.key==k)||db.cases.find(c=>c.id==did&&(!c.key||c.key==k));
  if(!x){x={id:db.cases.some(c=>c.id==did)?did+'x':did,ref:nextCase(),offender:String(n).trim(),dob:d||'',key:k,upd:T()};db.cases.push(x)}
  return x.id}
function caseOf(nm,dob){let cid='';dob=dob||'';if(!dob){const m=db.cases.filter(c=>nk(c.offender)==nk(nm));if(m.length==1){cid=m[0].id;dob=m[0].dob||''}} // même justiciable déjà connu : on réutilise son dossier
  if(!cid)cid=caseFor(nm,dob);return{cid,dob}}
function link(){let ch=false;
  if((role=='admin'||role=='fondateur')&&SRV>=24)db.docs.forEach(d=>{if(d.type=='Attestation appel'&&!d.caseId&&d.cible){let sn=null;try{sn=JSON.parse(d.data||'')}catch(e){}d.caseId=caseOf(d.cible,(sn&&sn.ob)||'').cid;d.upd=T();ch=true}}); // attestations d'appel déjà émises : dossier créé / retrouvé et lié automatiquement
  db.contests.forEach(c=>{const f=db.fines.find(x=>x.id==c.fineId);if(!f)return;const n0=db.cases.length,did=caseFor(f.offender,f.dob);
    if(db.cases.length>n0)ch=true;
    if(c.caseId!=did){c.caseId=did;c.upd=T();ch=true}});
  return ch}
const migr=()=>db.contests.forEach(c=>{if(c.status=='Réduite')c.aVerif=1;c.status=LEG[c.status]||c.status});
const DEFAULT_URL='https://script.google.com/macros/s/AKfycbygqYF7bJFrJsdccZBb8u-AsPrU8F8Va73NP2plYyzTompu3HHkivWz_3WposXBZgC7/exec'; // adresse du script Google intégrée : les collaborateurs n'ont rien à saisir
const def={fines:[],contests:[],cases:[],laws:[],ents:[],prefs:[],docs:[],motifs:[],frais:[],archsum:[],tomb:[],cfg:{court:'Cour Suprême',url:DEFAULT_URL,pin:hash('0000')}};
let db=Object.assign({},def,JSON.parse(localStorage.getItem('cs_db')||'{}'));
if(!db.cfg)db.cfg=def.cfg;if(!db.cfg.url)db.cfg.url=DEFAULT_URL; // ancienne configuration vide : on reprend l'adresse intégrée
let EDIT=null,CLI={login:'',sel:[]},FORCE=false,RECNEW='',ACCMSG='',SRV=0,page='dash',role=null,dirty=false,timer;
const pages=[['dash','Tableau de bord'],['new','Enregistrer une contestation'],['reg','Registre des amendes'],['con','Contestations'],['rem','Remboursements'],['fra','Frais de justice'],['doc','Documents'],['app',"Cour d'appel"],['cas','Dossiers'],['ent','Entités'],['set','Paramètres'],['hist','Historique'],['acc','Comptes']];

/* ---------- Thème ---------- */
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('cs_theme',t);$('#thm').textContent=t=='dark'?'☀ Jour':'🌙 Nuit'}
function toggleTheme(){setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark')}
setTheme(localStorage.getItem('cs_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));

/* ---------- Données / synchro Google Sheet ---------- */
let OFF=+localStorage.cs_off||0;
const CATS=['Contravention','Délit mineur','Délit majeur','Crime','Crime fédéral'],KEYS=['fines','contests','cases','laws','ents','prefs','docs','motifs','frais'],T=()=>Date.now()+OFF;
function save(){if(role=='lecteur'){toast('🔒 Compte en consultation : modification impossible');db=JSON.parse(localStorage.getItem('cs_db'));render();return}
  localStorage.setItem('cs_db',JSON.stringify(db));dirty=true;clearTimeout(timer);timer=setTimeout(push,800);render()}
function status(t){$('#sync').textContent=t}
const soft=()=>{if(page=='new'||page=='app'||EDIT||document.querySelector('.ov'))return;const af=document.querySelector('#accF input[name=prenom]');if(af&&(af.value||document.querySelector('#accF input[name=famille]').value))return;if(!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&(page=='rem'||!document.querySelector('main details[open]')))render()};
function merge(a,b,srv){const m={};(a||[]).forEach(r=>{r.upd=+r.upd||0;if(!m[r.id]||r.upd>m[r.id].upd)m[r.id]=r});(b||[]).forEach(r=>{r.upd=+r.upd||0;if(!m[r.id]||r.upd>m[r.id].upd||(srv&&r.upd==m[r.id].upd))m[r.id]=r});return Object.values(m)} // à date égale, la version du serveur l'emporte (elle contient l'auteur, le validateur…)
const wipe=()=>{db.fines=[];db.contests=[];db.cases=[];db.docs=[];db.frais=[];db.archsum=[];db.tomb=[]};
function mergeAll(r,w0){if(role=='lecteur')wipe();
  if(r.invalid&&r.invalid.length){['fines','contests'].forEach(k=>db[k]=db[k].filter(x=>!r.invalid.includes(x.id)));toast('⚠ Saisie refusée par le serveur (montant, entité ou amende invalide) : vérifiez-la puis recommencez',6000)}
  if(r.reverted&&r.reverted.length){['fines','contests'].forEach(k=>db[k]=db[k].filter(x=>!r.reverted.includes(x.id)));toast('🔒 Modification refusée : seul le créateur de la saisie (ou un administrateur) peut la modifier')}SRV=r.ver||0;if(r.archsum)db.archsum=role=='lecteur'?[]:r.archsum;if(r.now){const w=Date.now();OFF=r.now-(w0?(w0+w)/2:w);localStorage.cs_off=OFF}
  if(r.refused&&r.refused.length){db.tomb=db.tomb.filter(x=>!r.refused.includes(x.id));toast("🔒 Suppression refusée : seul un administrateur peut supprimer une contestation acceptée, facturée, payée ou créée par quelqu'un d'autre")}
  db.tomb=merge(db.tomb,r.tomb).filter(x=>x.arch||(+x.upd||0)>T()-180*864e5);const t={};db.tomb.forEach(x=>t[x.id]=x.upd);
  KEYS.forEach(k=>{db[k]=merge(db[k],r[k],true).filter(x=>!(t[x.id]>=x.upd))});migr();if(link())dirty=true;localStorage.setItem('cs_db',JSON.stringify(db))}
const RL={fondateur:'Fondateur',admin:'Administrateur',user:'Utilisateur',lecteur:'Consultation'};let me={},accs=null,jr=null;
const vis=k=>role=='lecteur'?['dash','reg','con','cas'].includes(k):(k=='acc'||k=='set'||k=='hist')?role!='user':true;
const who=(n,g)=>esc(n)+(g?' ('+esc(g)+')':'');
const auth=()=>({token:sessionStorage.cs_tok||''});
async function push(){
  if(role=='lecteur'){dirty=false;return}
  if(!db.cfg.url||!role){status('Non connecté');return}
  status('Envoi…');dirty=false;const t0=T()-1,w0=Date.now(),since=+localStorage.cs_last||0;
  try{const r=await fetch(db.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...auth(),...Object.fromEntries([...KEYS,'tomb'].map(k=>[k,db[k].filter(r=>(+r.upd||0)>=since)]))})});
    const j=await r.json();if(j.error=='code'){dirty=true;sessExpired();return}if(!j.ok)throw 0;localStorage.cs_last=t0;mergeAll(j,w0);status('✔ Synchronisé '+new Date().toLocaleTimeString());soft()}
  catch(e){dirty=true;status('⚠ Échec de synchro')}}
async function pull(m){
  if(!db.cfg.url||!role)return;
  if(m)loadStamps();
  status('Chargement…');
  try{const a=auth(),w0=Date.now(),j=await (await fetch(db.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...a,action:'get'})})).json();if(j.error=='code'){sessExpired();return}const n0=db.cases.filter(d=>d.offender).length;mergeAll(j,w0);const n1=db.cases.filter(d=>d.offender).length;status('✔ Synchronisé '+new Date().toLocaleTimeString());if(role=='lecteur'&&n1>n0){toast('📁 Un nouveau dossier vous a été attribué');render()}else soft()}
  catch(e){status('⚠ Échec de synchro')}
  if(dirty)push()}
setInterval(pull,60000);


/* ---------- Fenêtres de dialogue (remplacent confirm / prompt / alert) ---------- */
function dlg(o){return new Promise(res=>{
  const d=document.createElement('div'),I=o.input,today=wkey(new Date(T()));d.className='ov';
  d.innerHTML=`<div class="dlg ${o.danger?'danger':''}" role="dialog" aria-modal="true"><h3>${esc(o.title||(o.danger?'Confirmation requise':'Confirmation'))}</h3>${o.msg?`<p>${esc(o.msg)}</p>`:''}${o.code?`<div class="cd">${esc(o.code)}</div>`:''}${I?`<input id="dI" type="${I.type||'text'}" placeholder="${esc(I.ph||'')}" value="${esc(I.value||'')}" ${I.type=='date'?`min="1900-01-01" max="${today}"`:''} autocomplete="off"><div class="er" id="dE"></div>`:''}<div class="ac">${o.alert?'':`<button type="button" class="btn g" id="dN">${esc(o.no||'Annuler')}</button>`}<button type="button" class="btn ${o.danger?'d':''}" id="dY">${esc(o.ok||'Confirmer')}</button></div></div>`;
  const cancel=I?null:false,done=v=>{document.removeEventListener('keydown',kd);d.remove();res(v)},
  go=()=>{if(!I){done(true);return}const v=d.querySelector('#dI').value;
    if(I.min&&v.length<I.min){d.querySelector('#dE').textContent='Au moins '+I.min+' caractères.';return}
    if(I.type=='date'&&!v){d.querySelector('#dE').textContent='Choisissez une date.';return}done(v)},
  kd=e=>{if(e.key=='Escape'){if(!o.alert)done(cancel)}else if(e.key=='Enter'&&e.target.id!='dN'){e.preventDefault();go()}};
  document.addEventListener('keydown',kd);document.body.append(d);
  d.querySelector('#dY').onclick=go;const n=d.querySelector('#dN');if(n)n.onclick=()=>done(cancel);
  if(!o.alert)d.addEventListener('mousedown',e=>{if(e.target===d)done(cancel)});
  (d.querySelector('#dI')||d.querySelector('#dY')).focus()})}

/* ---------- Helpers ---------- */
const fmt=n=>(+n||0).toLocaleString('fr-FR')+' $';
const fine=id=>db.fines.find(f=>f.id==id)||{};
const cOf=fid=>db.contests.find(c=>c.fineId==fid);
const tag=s=>`<span class="tag ${s=='Accepté'?'ok':s=='Rejetée'?'ko':s=='En attente'?'':'w'}">${esc(s)}</span>`;
function toast(m,ms){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),ms||2200)}
const num=a=>Math.max(0,...a.map(o=>+String(o.ref).replace(/\D/g,'')||0))+1;
const nextRef=()=>'A-'+String(num(db.fines)).padStart(4,'0');
const nextCase=()=>'D-'+String(num(db.cases)).padStart(4,'0');
const pre=k=>(db.prefs.find(p=>p.id==k)||{}).v||(k=='fine'?'A':'D');
const rf=(o,k)=>pre(k)+'-'+String(+String(o.ref).replace(/\D/g,'')||0).padStart(4,'0');
const names=()=>[...new Set(db.fines.map(f=>f.offender))].sort();
const bd=d=>d?dfr(new Date(d+'T12:00:00')):'';
const pn=f=>esc(f.offender)+(f.dob?`<br><small class="mut">né(e) le ${bd(f.dob)}</small>`:'');
let PL=[];
const persons=()=>{const m={};db.fines.forEach(f=>{const k=pkf(f);if(!m[k])m[k]={k,name:String(f.offender||'').trim(),dob:f.dob||''}});return Object.values(m).sort((a,b)=>a.name.localeCompare(b.name)||String(a.dob).localeCompare(b.dob))};
const personOpts=ed=>{PL=persons();return `<option value="">${ed?'✎ Corriger les informations ci-dessous':'➕ Nouveau justiciable'}</option>`+PL.map((p,i)=>`<option value="${i}">${esc(p.name)} — ${p.dob?'né(e) le '+bd(p.dob):'date de naissance inconnue'}</option>`).join('')};
function pickPerson(s){const f=s.form,np=$('#np'),v=s.value;
  if(v===''){np.style.display='contents';if(!EDIT){f.offender.value='';f.dob.value=''}f.dob.required=!(EDIT&&!f.dob.value);hintName(f.offender);return}
  const p=PL[+v];f.offender.value=p.name;f.dob.value=p.dob;f.dob.required=false;np.style.display='none';$('#hn').style.display='none'}
function hintName(i){const h=$('#hn');if(!h)return;const k=nk(i.value),ed=EDIT?db.fines.find(x=>x.id==EDIT):null,l=k?persons().filter(p=>nk(p.name)==k&&!(ed&&p.k==pkf(ed))):[];
  if(!l.length){h.style.display='none';return}
  h.style.display='';h.textContent='⚠ '+(l.length>1?l.length+' justiciables portent déjà ce nom':'Un justiciable porte déjà ce nom')+' ('+l.map(p=>p.dob?'né(e) le '+bd(p.dob):'date de naissance inconnue').join(' ; ')+"). S'il s'agit de la même personne, choisissez-la dans la liste ci-dessus ; sinon la date de naissance permettra de les distinguer."}
async function chkHomonym(nm,dob,person){
  if(person!==''&&person!=null)return true;
  const same=persons().filter(p=>nk(p.name)==nk(nm));
  if(!same.length||same.some(p=>(p.dob||'')==(dob||'')))return true;
  return dlg({title:'Homonyme détecté',msg:'« '+nm+' » existe déjà ('+same.map(p=>p.dob?'né(e) le '+bd(p.dob):'date de naissance inconnue').join(' ; ')+').\n\nCréer une personne distincte née le '+bd(dob)+' ?\nSi c\'est la même personne, annulez et choisissez-la dans la liste.',ok:'Créer une personne distincte'})}
async function setDob(id){const d=db.cases.find(x=>x.id==id);if(!d||role=='user'||role=='lecteur')return;
  const v=await dlg({title:'Date de naissance',msg:'Date de naissance de '+d.offender+'.\nElle sera appliquée à toutes les amendes de ce dossier.',input:{type:'date'},ok:'Enregistrer'});
  if(!v)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||v>wkey(new Date(T()))||v<'1900-01-01'){toast('Date invalide');return}
  const t=T(),k=nk(d.offender);db.fines.forEach(f=>{if(!f.dob&&nk(f.offender)==k){f.dob=v;f.upd=t}});
  d.dob=v;d.key=pk(d.offender,v);d.upd=t;save()}

const refunds=()=>db.contests.filter(c=>c.status=='Accepté').map(c=>{const f=fine(c.fineId);return{c,f,t:+c.dateDec||+c.upd||0,ent:f.ent||'Entité non renseignée',amount:+f.amount||0}});
const monday=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const wkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dfr=d=>d.toLocaleDateString('fr-FR');
const eid=e=>String(Math.abs(+hash(nk(e)))%1000).padStart(3,'0');
const slug=s=>nk(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const payOf=ls=>ls.length>0&&ls.every(r=>r.c.pay=='Payé');
/* Factures Cour d'appel : intégrées aux totaux ; statut de paiement stocké dans les données du document (paid / payDate) */
const apDocs=()=>db.docs.filter(d=>d.type=='Facture appel').map(d=>{let sn=null;try{sn=JSON.parse(d.data||'')}catch(e){}return{d,sn,t:+d.date||0,ent:d.cible||'Entité non renseignée',amount:+d.total||0,paid:!!(sn&&sn.paid),ap:true}});
const apSum=ls=>ls.reduce((a,r)=>a+r.amount,0);
function payAp(id){if(SRV>0&&SRV<21){toast('⚠ Script Google obsolète (version '+SRV+') : déployez une nouvelle version du script (21 ou plus) pour suivre les paiements',7000);return}
  const d=db.docs.find(x=>x.id==id);if(!d||!d.data){toast('Statut impossible à modifier (document trop volumineux)');return}
  const sn=JSON.parse(d.data);if(sn.paid&&role=='user'){toast('🔒 Seul un administrateur peut annuler un paiement');return}
  sn.paid=!sn.paid;sn.payDate=sn.paid?T():0;d.data=JSON.stringify(sn);d.upd=T();save()}
const invCons=d=>{let sn;try{sn=JSON.parse(d.data||'')}catch(e){return[]}const refs=new Set((sn.items||[]).map(i=>i[0]));return db.fines.filter(f=>refs.has(rf(f,'fine'))).map(f=>cOf(f.id)).filter(Boolean)};
function docSt(d){ // statut de paiement d'une facture : {txt,cls,paid} ou null (document sans statut)
  if(d.type=='Facture appel'){let sn=null;try{sn=JSON.parse(d.data||'')}catch(e){}return sn?{txt:sn.paid?'Payé':'Facturé',cls:sn.paid?'ok':'b',paid:!!sn.paid}:null}
  if(d.type=='Facture'){const cs=invCons(d);if(!cs.length)return null;const n=cs.filter(c=>c.pay=='Payé').length,paid=n==cs.length;return{txt:paid?'Payé':n?'Partiellement payé ('+n+'/'+cs.length+')':'Facturé',cls:paid?'ok':'b',paid}}
  return null}
const payBtn=d=>{const s=docSt(d);return s&&role!='lecteur'?`<button class="btn s ${s.paid?'g':''}" onclick="${d.type=='Facture appel'?'payAp':'payInv'}('${d.id}')">${s.paid?'Annuler le paiement':'Marquer payé'}</button> `:''};
function payInv(id){const d=db.docs.find(x=>x.id==id);if(!d)return;const cs=invCons(d);
  if(!cs.length){toast('Amendes de cette facture introuvables (archivées ou supprimées) : le paiement se gère dans Remboursements');return}
  const p=cs.every(c=>c.pay=='Payé'),t=T();if(p&&role=='user'){toast('🔒 Seul un administrateur peut annuler un paiement');return}
  cs.forEach(c=>{c.pay=p?(c.billDate?'Facturé':''):'Payé';c.payDate=p?'':t;c.upd=t});save()}
const OPEN=new Set();let GRP=[],AGS=[];
function tog(k,o){o?OPEN.add(k):OPEN.delete(k)}
const stOf=l=>payOf(l)?'Payé':l.length&&l.every(r=>r.c.pay=='Facturé'||r.c.pay=='Payé')?'Facturé':'En attente de réclamation';
const billD=l=>Math.max(0,...l.map(r=>+r.c.billDate||0));
function billItems(l){const t=T();l.forEach(r=>{if(r.c.pay!='Payé'){if(r.c.pay!='Facturé')r.c.billDate=t;r.c.pay='Facturé';r.c.upd=t}})}
const live=l=>l.map(r=>({...r,c:db.contests.find(x=>x.id==r.c.id)||r.c}));
const archT=()=>(db.archsum||[]).reduce((a,x)=>a+(+x.amount||0),0);
function payGrp(i){const L=live(GRP[i].list),p=payOf(L),t=T();if(p&&role=='user'){toast('🔒 Seul un administrateur peut annuler un paiement');return}L.forEach(r=>{r.c.pay=p?(r.c.billDate?'Facturé':''):'Payé';r.c.payDate=p?'':t;r.c.upd=t});save()}
function unbillGrp(i){if(role=='user'){toast('🔒 Seul un administrateur peut annuler une facturation');return}live(GRP[i].list).forEach(r=>{if(r.c.pay=='Facturé'){r.c.pay='';r.c.billDate='';r.c.upd=T()}});save()}
function invGrp(i){const g=GRP[i],L=live(g.list),e=new Date(g.m);e.setDate(e.getDate()+6);const paid=payOf(L),use=paid?L:L.filter(r=>r.c.pay!='Payé');
  if(!paid)billItems(use);
  invoice(g.ent,use,'semaine du '+dfr(g.m)+' au '+dfr(e),'F-'+wkey(g.m).replace(/-/g,'')+'-'+eid(g.ent),paid)}
function invAg(j){const g=AGS[j],ls=live(g.list).filter(r=>r.c.pay!='Payé');
  if(!ls.length){toast('Rien à réclamer pour cette entité');return}
  billItems(ls);
  invoice(g.ent,ls,'toutes périodes (montants restant dus)','F-'+wkey(new Date()).replace(/-/g,'')+'-'+eid(g.ent),false)}
const cs=v=>{v=String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
function exportRem(){const apr=apDocs();const rows=[['Semaine du','Entité','N° amende','Justiciable','Naissance','Infraction','Date de décision','Validé par','Montant ($)','Statut']];
  refunds().sort((a,b)=>a.t-b.t).forEach(r=>rows.push([dfr(monday(r.t)),r.ent,rf(r.f,'fine'),r.f.offender||'',r.f.dob||'',r.f.inf||'',dfr(new Date(r.t)),r.c.val||r.c.pec||'',r.amount,r.c.pay=='Payé'?'Payé':r.c.pay=='Facturé'?'Facturé':'En attente de réclamation']));
  apr.sort((x,y)=>x.t-y.t).forEach(r=>rows.push([dfr(monday(r.t)),r.ent,r.d.num,'','',"Facture Cour d'appel",dfr(new Date(r.t)),r.d.cree||'',r.amount,r.paid?'Payé':'Facturé']));
  const csv='\ufeff'+rows.map(r=>r.map(cs).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='remboursements.csv';a.click()}

function shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onerror=rej;im.onload=()=>{try{
  const s=Math.min(1,1600/Math.max(im.width,im.height)),W0=Math.max(1,Math.round(im.width*s)),H0=Math.max(1,Math.round(im.height*s)),c0=document.createElement('canvas');c0.width=W0;c0.height=H0;
  const x0=c0.getContext('2d');x0.drawImage(im,0,0,W0,H0);
  let bx=0,by=0,bw=W0,bh=H0; /* rogne les marges transparentes */
  try{const q=x0.getImageData(0,0,W0,H0).data;let a=W0,b=H0,c=-1,d=-1;for(let y=0;y<H0;y++)for(let x=0;x<W0;x++)if(q[(y*W0+x)*4+3]>8){if(x<a)a=x;if(x>c)c=x;if(y<b)b=y;if(y>d)d=y}
    if(c>=a&&d>=b){bx=a;by=b;bw=c-a+1;bh=d-b+1}}catch(e){}
  let mx=420;
  for(;;){const k=Math.min(1,mx/Math.max(bw,bh)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(bw*k));c.height=Math.max(1,Math.round(bh*k));
    const cx=c.getContext('2d');cx.imageSmoothingQuality='high';cx.drawImage(c0,bx,by,bw,bh,0,0,c.width,c.height);
    try{const im2=cx.getImageData(0,0,c.width,c.height),q=im2.data,r5=v=>Math.min(255,((v>>3)<<3)+4);for(let i=0;i<q.length;i+=4){const a=q[i+3];if(a<8){q[i]=q[i+1]=q[i+2]=q[i+3]=0}else{q[i]=r5(q[i]);q[i+1]=r5(q[i+1]);q[i+2]=r5(q[i+2]);q[i+3]=a>=248?255:r5(a)}}cx.putImageData(im2,0,0)}catch(e){} /* 32 niveaux par couleur : image nette mais PNG ~35 % plus léger */
    const d=c.toDataURL('image/png');
    if(d.length<=120000||mx<=100){URL.revokeObjectURL(u);return res(d)}mx=Math.round(mx*.8)}
  }catch(e){rej(e)}};im.src=u})}

const PAL=['#7a1f2b','#b8923a','#2a5db0','#2f7d4f','#c27a10','#6b6a75'];
function invCard(){if(role=='lecteur')return '';
  const L=db.docs.filter(d=>d.type=='Facture'||d.type=='Facture appel').sort((a,b)=>(+b.date||0)-(+a.date||0));if(!L.length)return '';

function chartRem(){
  const rs=refunds().concat(role=='lecteur'?[]:apDocs()),N=8,cur=monday(T());
  if(!rs.length)return '';
  const wks=[];for(let i=N-1;i>=0;i--){const d=new Date(cur);d.setDate(d.getDate()-7*i);wks.push(d)}
  const tot={};rs.forEach(r=>tot[r.ent]=(tot[r.ent]||0)+r.amount);
  const top=Object.entries(tot).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]),oth=rs.some(r=>!top.includes(r.ent));
  const ents=[...top,...(oth?['Autres']:[])],col=e=>e=='Autres'?PAL[5]:PAL[top.indexOf(e)];
  const data=wks.map(m=>{const k=wkey(m),g={},ga={};rs.filter(r=>wkey(monday(r.t))==k).forEach(r=>{const e=top.includes(r.ent)?r.ent:'Autres';g[e]=(g[e]||0)+r.amount;if(r.ap)ga[e]=(ga[e]||0)+r.amount});return{m,g,ga,t:Object.values(g).reduce((a,b)=>a+b,0)}});
  const mx=Math.max(1,...data.map(d=>d.t)),a=data[N-1].t,b=data[N-2].t;
  const trend=b?(a>=b?'▲ +':'▼ −')+Math.round(Math.abs(a-b)/b*100)+' % vs la semaine précédente':(a?'Aucun remboursement la semaine précédente':'');
  return `<div class="card"><h3>Remboursements par semaine et par entité</h3>
  <p class="mut" style="margin:0 0 8px">Semaine en cours : <b>${fmt(a)}</b> ${trend}</p>
  <div style="display:flex;gap:8px;align-items:flex-end">${data.map(d=>`<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:190px"><small>${d.t?fmt(d.t):''}</small>
    <div style="width:70%;height:${Math.round(d.t/mx*150)}px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden">${ents.filter(e=>d.g[e]).map(e=>`<div title="${esc(e)} : ${fmt(d.g[e])}${d.ga[e]?' (dont Cour d\'appel : '+fmt(d.ga[e])+')':''}" style="flex:${d.g[e]};background:${col(e)};position:relative">${d.ga[e]?`<div class="apH" style="position:absolute;left:0;right:0;bottom:0;height:${Math.round(d.ga[e]/d.g[e]*100)}%"></div>`:''}</div>`).join('')}</div></div>`).join('')}</div>
  <div style="display:flex;gap:8px;border-top:1px solid var(--bd);margin-top:2px">${data.map(d=>`<small class="mut" style="flex:1;text-align:center">${String(d.m.getDate()).padStart(2,'0')}/${String(d.m.getMonth()+1).padStart(2,'0')}</small>`).join('')}</div>

let GH=[];
function ghosts(){GH=[...new Set(db.fines.map(f=>f.ent).filter(Boolean))].filter(n=>!db.ents.some(e=>e.n==n)).map(n=>({n,c:(db.ents.find(e=>nk(e.n)==nk(n))||{}).n||''}));

async function renEnt(id){const x=db.ents.find(e=>e.id==id);if(!x)return;
  const v=await dlg({title:"Renommer l'entité",msg:"Les amendes déjà enregistrées seront mises à jour. Si le nouveau nom est celui d'une autre entité, les deux seront fusionnées.",input:{value:x.n},ok:'Valider'});
  if(v===null)return;const n=v.trim();if(!n||n==x.n)return;
  const o=db.ents.find(e=>e.id!=id&&nk(e.n)==nk(n));
  if(o&&!await dlg({title:'Fusionner deux entités',msg:'« '+o.n+' » existe déjà. Toutes les amendes de « '+x.n+' » passeront sous « '+o.n+' ».',ok:'Fusionner',danger:true}))return;
  const to=o?o.n:n,old=nk(x.n),t=T();
  db.fines.forEach(f=>{if(nk(f.ent)==old){f.ent=to;f.upd=t}});
  if(o)kill('ents',id);else{x.n=n;x.upd=t}save()}

async function login(lg,code,silent,recovery){ // le code n'est envoyé qu'ici ; ensuite l'application ne garde que le jeton de session
  try{const r=await srvPost(recovery?{action:'login',login:lg,recovery:code}:{action:'login',login:lg,code});
    if(!r.ok){if(!silent&&$('#lerr'))$('#lerr').textContent=r.error=='locked'?lockMsg(r.sec||(r.wait||10)*60):'Identifiant ou code incorrect (5 échecs = blocage de 10 minutes).';return}
    if(!r.token){if($('#lerr'))$('#lerr').textContent='Script Google obsolète : redéployez la dernière version.';return}
    sessionStorage.cs_login=lg;sessionStorage.cs_tok=r.token;LASTSEEN=+r.prev||0;if(r.recovery)RECNEW=r.recovery;
    if(r.must){FORCE=true;render();return}
    await resume()}
  catch(e){if($('#lerr'))$('#lerr').textContent="Connexion impossible : vérifiez l'adresse du serveur et le déploiement du script."}}
async function resume(){
  try{const w0=Date.now(),j=await srvPost({action:'get',token:sessionStorage.cs_tok});
    if(!j.ok){sessionStorage.removeItem('cs_tok');EXPIRED=true;render();return}
    if(j.must){FORCE=true;render();return}
    if(j.role=='lecteur')wipe();FORCE=false;role=j.role;me={nom:j.nom,grade:j.grade};localStorage.cs_last=0;mergeAll(j,w0);status('✔ Synchronisé '+new Date().toLocaleTimeString());page='dash';render();if(dirty)push();loadStamps();if(LASTSEEN){toast('🕘 Dernière connexion : '+fmtDt(LASTSEEN)+". Si ce n'était pas vous, changez votre code (Mon code) et prévenez un administrateur.",12000);LASTSEEN=0}}

  $('#lerr').textContent='Connexion…';if(b){b.disabled=true;b.textContent='Connexion…'}

function filtDoc(){const q=$('#dq').value.toLowerCase(),t=$('#dt').value.toLowerCase();
  document.querySelectorAll('#docT tr').forEach((r,i)=>{if(!i)return;const ty=(r.querySelector('span[hidden]')||{textContent:''}).textContent.toLowerCase();r.style.display=r.textContent.toLowerCase().includes(q)&&(!t||ty==t)?'':'none'})}
function filt(id,v){v=v.toLowerCase();document.querySelectorAll('#'+id+' tr').forEach((r,i)=>{if(i)r.style.display=r.textContent.toLowerCase().includes(v)||[...r.querySelectorAll('select')].some(s=>s.value.toLowerCase()==v)?'':'none'})}

function render(){
  if(page!=lastPage){SEL.clear();lastPage=page;if(page!='new')pkReset('ml');if(page!='app'){pkReset('fa');pkReset('ra')}}
  $('#ttl').textContent='⚖ '+db.cfg.court;
  $('#who').textContent=role?'👤 '+(me.nom||sessionStorage.cs_login)+(me.grade?' · '+me.grade:'')+' ('+RL[role]+')':'';
  $('#prof').style.display=role&&role!='user'&&role!='lecteur'?'':'none';$('#stp').style.display=role&&role!='lecteur'?'':'none';['bsync','bcode','bout'].forEach(i=>$('#'+i).style.display=role?'':'none');if(!role)$('#sync').textContent=''; // pas de boutons de session sur l'écran de connexion
  
  const old=role&&role!='lecteur'&&SRV>0&&SRV<20?'<div class="card" style="border:2px solid var(--ko)"><b>⚠ Le script Google n\'est pas à jour.</b> Collez la dernière version du code dans Apps Script, puis Déployer › Gérer les déploiements › Nouvelle version (certaines fonctions — tampons, suppressions, dossiers — ne marcheront pas sinon).</div>':'';
  if(!role){$('#nav').innerHTML='';$('#main').innerHTML=FORCE?forceView():loginView();const af=$('#main').querySelector('[autofocus]');if(af)af.focus();if(!FORCE)loadAnn();showAnn();selBar();return}
  $('#nav').innerHTML=pages.filter(p=>vis(p[0])).map(([k,t])=>`<button class="${k==page?'on':''}" onclick="EDIT=null;page='${k}';render()">${t}</button>`).join('');
  const lec=role=='lecteur',has=db.cases.some(d=>d.offender);
  $('#main').innerHTML=lec&&!has
    ?`<h2>Aucune affaire en cours</h2><div class="card"><p>Aucune affaire en cours actuellement.</p><p class="mut">Les dossiers de vos clients apparaîtront ici dès qu'ils vous seront attribués. La page se met à jour automatiquement (environ chaque minute).</p><button class="btn g" onclick="pull(true)">Actualiser maintenant</button></div>`
    :old+(lec&&has&&page=='dash'&&!db.contests.some(c=>ST.indexOf(c.status)<2)?'<div class="card">Aucune affaire en cours actuellement : toutes les contestations de vos clients ont été jugées.</div>':'')+P[page]();
  $('#main').className=lec?'ro':'';selBar();
}
migr();render();if(sessionStorage.cs_tok&&db.cfg.url)resume();
</script>
