<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cour Suprême – Gestion des amendes</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#1c1b22;--mut:#6b6a75;--ac:#7a1f2b;--ac2:#b8923a;--bd:#ddd6c8;--ok:#2f7d4f;--warn:#c27a10;--ko:#b3261e;--hd:#7a1f2b;--onac:#fff}
:root[data-theme=dark]{--bg:#0d1424;--card:#151e33;--tx:#ebe6d6;--mut:#98a2b8;--ac:#d4af37;--ac2:#a88a2e;--bd:#26324d;--ok:#5cc48a;--warn:#e3a64a;--ko:#f0807a;--hd:#14213d;--onac:#1a1405}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Georgia,'Times New Roman',serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--hd);color:#fff;flex-wrap:wrap;border-bottom:3px solid var(--ac2)}
header h1{font-size:20px;margin:0;flex:1}header button{background:#ffffff22;color:#fff;border:1px solid #fff5;border-radius:6px;padding:6px 10px;cursor:pointer}
#sync{font-size:12px;opacity:.9}
nav{display:flex;gap:4px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd);overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{background:none;border:0;color:var(--mut);padding:8px 12px;cursor:pointer;font:inherit;border-radius:6px;white-space:nowrap}
nav button.on{background:var(--ac);color:var(--onac)}
main{max-width:1100px;margin:0 auto;padding:20px}
h2{margin-top:0;color:var(--ac);border-bottom:2px solid var(--ac2);padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.stat b{display:block;font-size:26px;color:var(--ac)}.stat span{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px}input[type=checkbox]{width:auto}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{background:var(--ac);color:var(--onac);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit;margin-top:12px}
.btn.s{padding:3px 8px;margin:0;font-size:13px}.btn.g{background:var(--mut);color:var(--onac)}.btn.d{background:var(--ko);color:var(--onac)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px;vertical-align:top}
th{color:var(--mut);font-weight:600}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--bd)}
.tag.b{background:#2a5db0;color:#fff}.tag.ok{background:var(--ok);color:var(--onac)}.tag.ko{background:var(--ko);color:var(--onac)}.tag.w{background:var(--warn);color:var(--onac)}
.bar{height:10px;background:var(--ac2);border-radius:5px}.mut{color:var(--mut)}
.toast{position:fixed;bottom:84px;right:16px;background:var(--ok);color:#fff;padding:10px 16px;border-radius:8px;z-index:100;max-width:420px}
#main{padding-bottom:90px}
#selbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--ac);padding:10px 16px;display:none;gap:12px;align-items:center;flex-wrap:wrap;z-index:50;box-shadow:0 -4px 12px rgba(0,0,0,.18)}
#selbar.on{display:flex}#selbar .btn{margin:0}
.ro td select,.ro td input,.ro td textarea,.ro td .btn{pointer-events:none;opacity:.55}

.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.dlg{width:min(460px,100%);background:var(--card);color:var(--tx);border:1px solid var(--bd);border-top:4px solid var(--ac2);border-radius:12px;padding:20px;box-shadow:0 12px 40px #0007;max-height:90vh;overflow:auto}
.dlg h3{margin:0 0 8px;color:var(--ac)}.dlg p{white-space:pre-line;margin:0 0 12px}
.dlg .ac{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.dlg .btn{margin:0}
.dlg.danger{border-top-color:var(--ko)}.dlg.danger h3{color:var(--ko)}
.dlg .cd{font:600 20px monospace;letter-spacing:1px;background:var(--bg);border:1px dashed var(--ac2);padding:10px;border-radius:8px;text-align:center;user-select:all;margin:0 0 12px;word-break:break-all}
.dlg .er{color:var(--ko);font-size:13px;margin-top:6px;min-height:1em}
</style>
</head>
<body>
<header><h1 id="ttl">⚖ Cour Suprême</h1><span id="sync"></span><span id="who"></span><button onclick="pull(true)">⟳ Synchroniser</button><button onclick="toggleTheme()" id="thm">🌙 Nuit</button><button id="prof" onclick="myProfile()" style="display:none">Mon profil</button><button onclick="myCode()">Mon code</button><button id="stp" onclick="pickStamp(sessionStorage.cs_login)">Mon tampon</button><button onclick="logout()">Déconnexion</button></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="selbar"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ST=['En attente',"En cours d'instruction",'Accepté','Rejetée'],LEG={'En audience':ST[1],'Acceptée':'Accepté','Réduite':'Accepté'};
const nk=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
const pk=(n,d)=>nk(n)+(d?'|'+d:''),pkf=f=>pk(f.offender,f.dob),dcase=(n,d)=>'d'+hash(pk(n,d));
function caseFor(n,d){const k=pk(n,d),did=dcase(n,d);
  let x=db.cases.find(c=>c.key==k)||db.cases.find(c=>c.id==did&&(!c.key||c.key==k));
  if(!x){x={id:db.cases.some(c=>c.id==did)?did+'x':did,ref:nextCase(),offender:String(n).trim(),dob:d||'',key:k,upd:T()};db.cases.push(x)}
  return x.id}
function link(){let ch=false;
  db.contests.forEach(c=>{const f=db.fines.find(x=>x.id==c.fineId);if(!f)return;const n0=db.cases.length,did=caseFor(f.offender,f.dob);
    if(db.cases.length>n0)ch=true;
    if(c.caseId!=did){c.caseId=did;c.upd=T();ch=true}});
  return ch}
const migr=()=>db.contests.forEach(c=>{if(c.status=='Réduite')c.aVerif=1;c.status=LEG[c.status]||c.status});
const DEFAULT_URL='https://script.google.com/macros/s/AKfycbygqYF7bJFrJsdccZBb8u-AsPrU8F8Va73NP2plYyzTompu3HHkivWz_3WposXBZgC7/exec'; // adresse du script Google intégrée : les collaborateurs n'ont rien à saisir
const def={fines:[],contests:[],cases:[],laws:[],ents:[],prefs:[],docs:[],motifs:[],archsum:[],tomb:[],cfg:{court:'Cour Suprême',url:DEFAULT_URL,pin:hash('0000')}};
let db=Object.assign({},def,JSON.parse(localStorage.getItem('cs_db')||'{}'));
if(!db.cfg)db.cfg=def.cfg;if(!db.cfg.url)db.cfg.url=DEFAULT_URL; // ancienne configuration vide : on reprend l'adresse intégrée
let EDIT=null,CLI={login:'',sel:[]},FORCE=false,RECNEW='',ACCMSG='',SRV=0,page='dash',role=null,dirty=false,timer;
const pages=[['dash','Tableau de bord'],['new','Enregistrer une contestation'],['reg','Registre des amendes'],['con','Contestations'],['rem','Remboursements'],['doc','Documents'],['cas','Dossiers'],['ent','Entités'],['set','Paramètres'],['hist','Historique'],['acc','Comptes'],['help',"Mode d'emploi"]];

/* ---------- Thème ---------- */
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('cs_theme',t);$('#thm').textContent=t=='dark'?'☀ Jour':'🌙 Nuit'}
function toggleTheme(){setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark')}
setTheme(localStorage.getItem('cs_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));

/* ---------- Données / synchro Google Sheet ---------- */
let OFF=+localStorage.cs_off||0;
const CATS=['Contravention','Délit mineur','Délit majeur','Crime','Crime fédéral'],KEYS=['fines','contests','cases','laws','ents','prefs','docs','motifs'],T=()=>Date.now()+OFF;
function save(){if(role=='lecteur'){toast('🔒 Compte en consultation : modification impossible');db=JSON.parse(localStorage.getItem('cs_db'));render();return}
  localStorage.setItem('cs_db',JSON.stringify(db));dirty=true;clearTimeout(timer);timer=setTimeout(push,800);render()}
function status(t){$('#sync').textContent=t}
const soft=()=>{if(page=='new'||EDIT||document.querySelector('.ov'))return;const af=document.querySelector('#accF input[name=prenom]');if(af&&(af.value||document.querySelector('#accF input[name=famille]').value))return;if(!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&(page=='rem'||!document.querySelector('main details[open]')))render()};
function merge(a,b,srv){const m={};(a||[]).forEach(r=>{r.upd=+r.upd||0;if(!m[r.id]||r.upd>m[r.id].upd)m[r.id]=r});(b||[]).forEach(r=>{r.upd=+r.upd||0;if(!m[r.id]||r.upd>m[r.id].upd||(srv&&r.upd==m[r.id].upd))m[r.id]=r});return Object.values(m)} // à date égale, la version du serveur l'emporte (elle contient l'auteur, le validateur…)
const wipe=()=>{db.fines=[];db.contests=[];db.cases=[];db.docs=[];db.archsum=[];db.tomb=[]};
function mergeAll(r,w0){if(role=='lecteur')wipe();
  if(r.invalid&&r.invalid.length){['fines','contests'].forEach(k=>db[k]=db[k].filter(x=>!r.invalid.includes(x.id)));toast('⚠ Saisie refusée par le serveur (montant, entité ou amende invalide) : vérifiez-la puis recommencez',6000)}
  if(r.reverted&&r.reverted.length){['fines','contests'].forEach(k=>db[k]=db[k].filter(x=>!r.reverted.includes(x.id)));toast('🔒 Modification refusée : seul le créateur de la saisie (ou un administrateur) peut la modifier')}SRV=r.ver||0;if(r.archsum)db.archsum=role=='lecteur'?[]:r.archsum;if(r.now){const w=Date.now();OFF=r.now-(w0?(w0+w)/2:w);localStorage.cs_off=OFF}
  if(r.refused&&r.refused.length){db.tomb=db.tomb.filter(x=>!r.refused.includes(x.id));toast("🔒 Suppression refusée : seul un administrateur peut supprimer une contestation acceptée, facturée, payée ou créée par quelqu'un d'autre")}
  db.tomb=merge(db.tomb,r.tomb).filter(x=>x.arch||(+x.upd||0)>T()-180*864e5);const t={};db.tomb.forEach(x=>t[x.id]=x.upd);
  KEYS.forEach(k=>{db[k]=merge(db[k],r[k],true).filter(x=>!(t[x.id]>=x.upd))});migr();if(link())dirty=true;localStorage.setItem('cs_db',JSON.stringify(db))}
const RL={fondateur:'Fondateur',admin:'Administrateur',user:'Utilisateur',lecteur:'Consultation'};let me={},accs=null,jr=null;
const vis=k=>role=='lecteur'?['dash','reg','con','cas','help'].includes(k):(k=='acc'||k=='set'||k=='hist')?role!='user':true;
const who=(n,g)=>esc(n)+(g?' ('+esc(g)+')':'');
const auth=()=>({token:sessionStorage.cs_tok||''});
async function push(){
  if(role=='lecteur'){dirty=false;return}
  if(!db.cfg.url||!role){status('Non connecté');return}
  status('Envoi…');dirty=false;const t0=T()-1,w0=Date.now(),since=+localStorage.cs_last||0;
  try{const r=await fetch(db.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...auth(),...Object.fromEntries([...KEYS,'tomb'].map(k=>[k,db[k].filter(r=>(+r.upd||0)>=since)]))})});
    const j=await r.json();if(j.error=='code'){dirty=true;logout();return}if(!j.ok)throw 0;localStorage.cs_last=t0;mergeAll(j,w0);status('✔ Synchronisé '+new Date().toLocaleTimeString());soft()}
  catch(e){dirty=true;status('⚠ Échec de synchro')}}
async function pull(m){
  if(!db.cfg.url||!role)return;
  if(m)loadStamps();
  status('Chargement…');
  try{const a=auth(),w0=Date.now(),j=await (await fetch(db.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...a,action:'get'})})).json();if(j.error=='code'){logout();return}const n0=db.cases.filter(d=>d.offender).length;mergeAll(j,w0);const n1=db.cases.filter(d=>d.offender).length;status('✔ Synchronisé '+new Date().toLocaleTimeString());if(role=='lecteur'&&n1>n0){toast('📁 Un nouveau dossier vous a été attribué');render()}else soft()}
  catch(e){status('⚠ Échec de synchro')}
  if(dirty)push()}
setInterval(pull,60000);


/* ---------- Fenêtres de dialogue (remplacent confirm / prompt / alert) ---------- */
function dlg(o){return new Promise(res=>{
  const d=document.createElement('div'),I=o.input,today=wkey(new Date(T()));d.className='ov';
  d.innerHTML=`<div class="dlg ${o.danger?'danger':''}" role="dialog" aria-modal="true"><h3>${esc(o.title||(o.danger?'Confirmation requise':'Confirmation'))}</h3>${o.msg?`<p>${esc(o.msg)}</p>`:''}${o.code?`<div class="cd">${esc(o.code)}</div>`:''}${I?`<input id="dI" type="${I.type||'text'}" placeholder="${esc(I.ph||'')}" value="${esc(I.value||'')}" ${I.type=='date'?`min="1900-01-01" max="${today}"`:''} autocomplete="off"><div class="er" id="dE"></div>`:''}<div class="ac">${o.alert?'':`<button type="button" class="btn g" id="dN">${esc(o.no||'Annuler')}</button>`}<button type="button" class="btn ${o.danger?'d':''}" id="dY">${esc(o.ok||'Confirmer')}</button></div></div>`;
  const cancel=I?null:false,done=v=>{document.removeEventListener('keydown',kd);d.remove();res(v)},
  go=()=>{if(!I){done(true);return}const v=d.querySelector('#dI').value;
    if(I.min&&v.length<I.min){d.querySelector('#dE').textContent='Au moins '+I.min+' caractères.';return}
    if(I.type=='date'&&!v){d.querySelector('#dE').textContent='Choisissez une date.';return}done(v)},
  kd=e=>{if(e.key=='Escape'){if(!o.alert)done(cancel)}else if(e.key=='Enter'&&e.target.id!='dN'){e.preventDefault();go()}};
  document.addEventListener('keydown',kd);document.body.append(d);
  d.querySelector('#dY').onclick=go;const n=d.querySelector('#dN');if(n)n.onclick=()=>done(cancel);
  if(!o.alert)d.addEventListener('mousedown',e=>{if(e.target===d)done(cancel)});
  (d.querySelector('#dI')||d.querySelector('#dY')).focus()})}

/* ---------- Helpers ---------- */
const fmt=n=>(+n||0).toLocaleString('fr-FR')+' $';
const fine=id=>db.fines.find(f=>f.id==id)||{};
const cOf=fid=>db.contests.find(c=>c.fineId==fid);
const tag=s=>`<span class="tag ${s=='Accepté'?'ok':s=='Rejetée'?'ko':s=='En attente'?'':'w'}">${esc(s)}</span>`;
function toast(m,ms){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),ms||2200)}
const num=a=>Math.max(0,...a.map(o=>+String(o.ref).replace(/\D/g,'')||0))+1;
const nextRef=()=>'A-'+String(num(db.fines)).padStart(4,'0');
const nextCase=()=>'D-'+String(num(db.cases)).padStart(4,'0');
const pre=k=>(db.prefs.find(p=>p.id==k)||{}).v||(k=='fine'?'A':'D');
const rf=(o,k)=>pre(k)+'-'+String(+String(o.ref).replace(/\D/g,'')||0).padStart(4,'0');
const names=()=>[...new Set(db.fines.map(f=>f.offender))].sort();
const bd=d=>d?dfr(new Date(d+'T12:00:00')):'';
const pn=f=>esc(f.offender)+(f.dob?`<br><small class="mut">né(e) le ${bd(f.dob)}</small>`:'');
let PL=[];
const persons=()=>{const m={};db.fines.forEach(f=>{const k=pkf(f);if(!m[k])m[k]={k,name:String(f.offender||'').trim(),dob:f.dob||''}});return Object.values(m).sort((a,b)=>a.name.localeCompare(b.name)||String(a.dob).localeCompare(b.dob))};
const personOpts=ed=>{PL=persons();return `<option value="">${ed?'✎ Corriger les informations ci-dessous':'➕ Nouveau justiciable'}</option>`+PL.map((p,i)=>`<option value="${i}">${esc(p.name)} — ${p.dob?'né(e) le '+bd(p.dob):'date de naissance inconnue'}</option>`).join('')};
function pickPerson(s){const f=s.form,np=$('#np'),v=s.value;
  if(v===''){np.style.display='contents';if(!EDIT){f.offender.value='';f.dob.value=''}f.dob.required=!(EDIT&&!f.dob.value);hintName(f.offender);return}
  const p=PL[+v];f.offender.value=p.name;f.dob.value=p.dob;f.dob.required=false;np.style.display='none';$('#hn').style.display='none'}
function hintName(i){const h=$('#hn');if(!h)return;const k=nk(i.value),ed=EDIT?db.fines.find(x=>x.id==EDIT):null,l=k?persons().filter(p=>nk(p.name)==k&&!(ed&&p.k==pkf(ed))):[];
  if(!l.length){h.style.display='none';return}
  h.style.display='';h.textContent='⚠ '+(l.length>1?l.length+' justiciables portent déjà ce nom':'Un justiciable porte déjà ce nom')+' ('+l.map(p=>p.dob?'né(e) le '+bd(p.dob):'date de naissance inconnue').join(' ; ')+"). S'il s'agit de la même personne, choisissez-la dans la liste ci-dessus ; sinon la date de naissance permettra de les distinguer."}
async function chkHomonym(nm,dob,person){
  if(person!==''&&person!=null)return true;
  const same=persons().filter(p=>nk(p.name)==nk(nm));
  if(!same.length||same.some(p=>(p.dob||'')==(dob||'')))return true;
  return dlg({title:'Homonyme détecté',msg:'« '+nm+' » existe déjà ('+same.map(p=>p.dob?'né(e) le '+bd(p.dob):'date de naissance inconnue').join(' ; ')+').\n\nCréer une personne distincte née le '+bd(dob)+' ?\nSi c\'est la même personne, annulez et choisissez-la dans la liste.',ok:'Créer une personne distincte'})}
async function setDob(id){const d=db.cases.find(x=>x.id==id);if(!d||role=='user'||role=='lecteur')return;
  const v=await dlg({title:'Date de naissance',msg:'Date de naissance de '+d.offender+'.\nElle sera appliquée à toutes les amendes de ce dossier.',input:{type:'date'},ok:'Enregistrer'});
  if(!v)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||v>wkey(new Date(T()))||v<'1900-01-01'){toast('Date invalide');return}
  const t=T(),k=nk(d.offender);db.fines.forEach(f=>{if(!f.dob&&nk(f.offender)==k){f.dob=v;f.upd=t}});
  d.dob=v;d.key=pk(d.offender,v);d.upd=t;save()}

/* ---------- Remboursements (par semaine et par agence) ---------- */
const refunds=()=>db.contests.filter(c=>c.status=='Accepté').map(c=>{const f=fine(c.fineId);return{c,f,t:+c.dateDec||+c.upd||0,ent:f.ent||'Entité non renseignée',amount:+f.amount||0}});
const monday=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const wkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dfr=d=>d.toLocaleDateString('fr-FR');
const eid=e=>String(Math.abs(+hash(nk(e)))%1000).padStart(3,'0');
const slug=s=>nk(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const payOf=ls=>ls.length>0&&ls.every(r=>r.c.pay=='Payé');
const OPEN=new Set();let GRP=[],AGS=[];
function tog(k,o){o?OPEN.add(k):OPEN.delete(k)}
const stOf=l=>payOf(l)?'Payé':l.length&&l.every(r=>r.c.pay=='Facturé'||r.c.pay=='Payé')?'Facturé':'En attente de réclamation';
const billD=l=>Math.max(0,...l.map(r=>+r.c.billDate||0));
function billItems(l){const t=T();l.forEach(r=>{if(r.c.pay!='Payé'){if(r.c.pay!='Facturé')r.c.billDate=t;r.c.pay='Facturé';r.c.upd=t}})}
const live=l=>l.map(r=>({...r,c:db.contests.find(x=>x.id==r.c.id)||r.c}));
const archT=()=>(db.archsum||[]).reduce((a,x)=>a+(+x.amount||0),0);
function payGrp(i){const L=live(GRP[i].list),p=payOf(L),t=T();if(p&&role=='user'){toast('🔒 Seul un administrateur peut annuler un paiement');return}L.forEach(r=>{r.c.pay=p?(r.c.billDate?'Facturé':''):'Payé';r.c.payDate=p?'':t;r.c.upd=t});save()}
function unbillGrp(i){if(role=='user'){toast('🔒 Seul un administrateur peut annuler une facturation');return}live(GRP[i].list).forEach(r=>{if(r.c.pay=='Facturé'){r.c.pay='';r.c.billDate='';r.c.upd=T()}});save()}
function invGrp(i){const g=GRP[i],L=live(g.list),e=new Date(g.m);e.setDate(e.getDate()+6);const paid=payOf(L),use=paid?L:L.filter(r=>r.c.pay!='Payé');
  if(!paid)billItems(use);
  invoice(g.ent,use,'semaine du '+dfr(g.m)+' au '+dfr(e),'F-'+wkey(g.m).replace(/-/g,'')+'-'+eid(g.ent),paid)}

/* ---------- Graphique des remboursements (8 dernières semaines) ---------- */
const PAL=['#7a1f2b','#b8923a','#2a5db0','#2f7d4f','#c27a10','#6b6a75'];
function chartRem(){
  const rs=refunds(),N=8,cur=monday(T());
  if(!rs.length)return '';
  const wks=[];for(let i=N-1;i>=0;i--){const d=new Date(cur);d.setDate(d.getDate()-7*i);wks.push(d)}
  const tot={};rs.forEach(r=>tot[r.ent]=(tot[r.ent]||0)+r.amount);
  const top=Object.entries(tot).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]),oth=rs.some(r=>!top.includes(r.ent));
  const ents=[...top,...(oth?['Autres']:[])],col=e=>e=='Autres'?PAL[5]:PAL[top.indexOf(e)];
  const data=wks.map(m=>{const k=wkey(m),g={};rs.filter(r=>wkey(monday(r.t))==k).forEach(r=>{const e=top.includes(r.ent)?r.ent:'Autres';g[e]=(g[e]||0)+r.amount});return{m,g,t:Object.values(g).reduce((a,b)=>a+b,0)}});
  const mx=Math.max(1,...data.map(d=>d.t)),a=data[N-1].t,b=data[N-2].t;
  const trend=b?(a>=b?'▲ +':'▼ −')+Math.round(Math.abs(a-b)/b*100)+' % vs la semaine précédente':(a?'Aucun remboursement la semaine précédente':'');
  return `<div class="card"><h3>Remboursements par semaine et par entité</h3>
  <p class="mut" style="margin:0 0 8px">Semaine en cours : <b>${fmt(a)}</b> ${trend}</p>
  <div style="display:flex;gap:8px;align-items:flex-end">${data.map(d=>`<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:190px"><small>${d.t?fmt(d.t):''}</small>
    <div style="width:70%;height:${Math.round(d.t/mx*150)}px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden">${ents.filter(e=>d.g[e]).map(e=>`<div title="${esc(e)} : ${fmt(d.g[e])}" style="flex:${d.g[e]};background:${col(e)}"></div>`).join('')}</div></div>`).join('')}</div>
  <div style="display:flex;gap:8px;border-top:1px solid var(--bd);margin-top:2px">${data.map(d=>`<small class="mut" style="flex:1;text-align:center">${String(d.m.getDate()).padStart(2,'0')}/${String(d.m.getMonth()+1).padStart(2,'0')}</small>`).join('')}</div>
  <p style="margin:10px 0 0">${ents.map(e=>`<span style="margin-right:14px;white-space:nowrap"><span style="display:inline-block;width:11px;height:11px;border-radius:2px;background:${col(e)}"></span> ${esc(e)}</span>`).join('')}</p></div>`}

function selAll(el){el.closest('table').querySelectorAll('td input[data-id]').forEach(x=>{if(x.closest('tr').style.display=='none')return;x.checked=el.checked;el.checked?SEL.add(x.dataset.id):SEL.delete(x.dataset.id)});selBar()}

const selRows=()=>refunds().filter(r=>SEL.has(r.c.id));
function selBar(){const b=$('#selbar');if(!b)return;

  if(!rs.length){b.className='';b.innerHTML='';return}
  const offs=[...new Set(rs.map(r=>pkf(r.f)))],ents=[...new Set(rs.map(r=>r.ent))],tot=rs.reduce((a,r)=>a+r.amount,0);
  b.className='on';

  <button class="btn s" onclick="attSel()">Attestation unique</button>${page=='rem'?'<button class="btn s" onclick="invSel()">Facture</button>':''}<button class="btn s g" onclick="selClear()">Tout désélectionner</button>`}
function attSel(){const rs=selRows();
  if(!rs.length){toast('Aucune contestation acceptée sélectionnée');return}
  if(new Set(rs.map(r=>pkf(r.f))).size>1){toast("⚠ Une attestation ne concerne qu'un seul justiciable : sélectionnez des amendes du même justiciable",5000);return}
  const cs=rs.map(r=>r.c);SEL.clear();attest(cs)}
function invSel(){const rs=live(selRows());

  const ents=[...new Set(rs.map(r=>r.ent))];
  if(ents.length>1){toast('⚠ Une facture ne concerne qu\'une seule entité : sélectionnez des amendes de la même entité ('+ents.join(', ')+')',6000);return}
  const ent=ents[0],paid=payOf(rs),use=paid?rs:rs.filter(r=>r.c.pay!='Payé');
  if(!paid)billItems(use);
  const ts=use.map(r=>r.t),a=new Date(Math.min(...ts)),b=new Date(Math.max(...ts));
  SEL.clear();
  invoice(ent,use,'amendes sélectionnées (décisions du '+dfr(a)+' au '+dfr(b)+')','F-'+wkey(new Date(T())).replace(/-/g,'')+'-'+eid(ent)+'-S',paid)}

ent(){

help(){
  return `<h2>Mode d'emploi</h2><div class="card"><ol>
  <li><b>Enregistrer une contestation</b> : choisissez le justiciable dans la liste (ou créez-le avec son nom et sa <b>date de naissance</b> : deux homonymes nés à des dates différentes sont deux dossiers distincts ; les dossiers anciens sans date se complètent depuis la page Dossiers), choisissez l'infraction dans la liste (classée par catégorie), indiquez l'entité qui a appliqué l'amende (obligatoire) et, si besoin, l'agent (facultatif), vérifiez le montant et saisissez le motif. L'amende et sa contestation sont créées ensemble.</li>
  <li><b>Registre</b> : retrouvez toutes les amendes contestées et recherchez-les.</li>
  <li><b>Contestations</b> : changez le statut (En attente, En cours d'instruction, Accepté ou Rejetée ; un rejet exige un motif), notez la décision et rattachez l'affaire à un dossier.</li>
  <li><b>Dossiers</b> : un dossier est créé automatiquement pour chaque justiciable dès sa première contestation. Il regroupe tout son historique (nombre de contestations, acceptées, rejetées, en cours) et signale les justiciables récurrents (3 contestations ou plus).</li>
  <li><b>Entités</b> : suivi par agence. Le tableau liste chaque entité avec ses amendes, contestations (acceptées, rejetées, en cours), taux d'acceptation, montant remboursé et reste dû. « Détail » ouvre la fiche de l'entité : suivi par agent et par infraction, liste de toutes ses amendes avec leur statut de contestation et de paiement, et facture du reste dû. Les entités se créent dans Paramètres ; une amende dont l'entité n'est pas renseignée apparaît sous « Entité non renseignée ».</li>
  <li><b>Paramètres</b> : réservés à l'administrateur. Vous y gérez la liste des infractions (contravention, délit mineur, délit majeur, crime, crime fédéral), les entités et le préfixe des numéros (ex. AMD-0001) et collez l'URL du script Google pour activer la synchronisation.</li>
  <li><b>Blocage</b> : après 5 codes incorrects, le compte est bloqué 10 minutes. Un administrateur peut le débloquer tout de suite (Comptes › Débloquer ; pour un administrateur, seul le fondateur). Le fondateur, lui, utilise son code de déblocage (bouton sur l'écran de connexion). Les blocages et déblocages sont dans l'Historique.</li>
  <li><b>Connexion</b> : chaque personne a son propre compte (identifiant + code) et peut changer son code avec « Mon code ». Rôles : <b>Utilisateur</b> (tout sauf Paramètres), <b>Administrateur</b> (Paramètres, Historique et gestion des Comptes en plus), <b>Fondateur</b> (administrateur dont le compte ne peut être modifié par personne d'autre). Chaque compte peut avoir un grade (Superviseur, Juge, Procureur, Avocat) affiché à côté du nom. La première personne qui fait passer une contestation de « En attente » à un autre statut en est inscrite comme prenant en charge.</li><li><b>Remboursements</b> : montants rendus (contestations acceptées) par semaine et par entité, avec le statut « En attente de réclamation », « Facturé » (automatique dès que la facture est générée) ou « Payé ». Les boutons « Facture PNG » et « Attestation PNG » génèrent une image à envoyer (la facture à l'entité, l'attestation au justiciable). Le magistrat qui a fait passer la contestation à « Accepté » est inscrit comme validateur : son « Nom affiché » doit donc être « Prénom Nom » et son grade renseigné.</li><li><b>Création de compte</b> : on saisit le prénom et le nom de famille ; l'identifiant est généré automatiquement (ex. « Jean Dupont » → jean.dupont, avec un numéro si déjà pris) et le nom affiché devient « Prénom Nom ». L'identifiant ne change plus ensuite.</li><li><b>Motifs de rejet</b> : un administrateur définit dans Paramètres une liste de motifs ; au moment d'un rejet, on choisit un motif dans la liste et on peut y ajouter une précision.</li><li><b>Verrouillage</b> : une contestation « Facturé » ou « Payé » ne peut plus changer de statut (ni de date de décision, ni voir sa facturation annulée) sans un administrateur, qui doit confirmer ; la modification est inscrite dans l'Historique. <b>Date de décision</b> : dans la page Contestations, un administrateur peut corriger la date d'une contestation acceptée (« approx. » = date estimée pour les anciennes). Le tableau de bord affiche un graphique des remboursements par semaine et par entité.</li><li><b>Documents</b> : l'historique de toutes les attestations et factures générées (qui, quand, pour qui, montant). Un clic sur « Télécharger PNG » régénère l'image à l'identique.</li><li><b>Tampons</b> : chaque personne peut importer son tampon (PNG à fond transparent) avec « Mon tampon » ; un administrateur peut aussi le faire pour un autre compte dans la page Comptes. Le tampon du magistrat qui a validé la contestation est apposé sur l'attestation.</li><li><b>Premier accès</b> : un compte créé par un administrateur (ou dont le code a été réinitialisé) reçoit un code provisoire ; à la première connexion, la personne doit choisir son propre code avant d'accéder à quoi que ce soit. <b>Consultation</b> : rôle réservé aux avocats, qui peuvent consulter le tableau de bord, le registre, les contestations et les dossiers, sans rien modifier (le script refuse toute écriture). Dans « Comptes », le bouton « Clients » lie l'avocat à des dossiers : il ne voit que les dossiers de ses clients, avec leurs amendes et contestations (sans les données de facturation).</li><li><b>Session</b> : votre code n'est envoyé qu'à la connexion ; ensuite un jeton temporaire (valable 6 h d'inactivité) identifie votre poste. Se déconnecter, changer son code ou être désactivé ferme la session immédiatement.</li><li><b>Modifier une saisie</b> : bouton « Modifier » dans le registre ou les contestations. Un utilisateur ne modifie que ce qu'il a créé (et jamais une contestation acceptée, facturée ou payée) ; un administrateur ou le fondateur modifie tout. Chaque modification est notée dans l'Historique. <b>Pièce jointe</b> : champ facultatif du formulaire, à remplir avec un lien https:// (Drive, capture en ligne…) ; elle s'affiche en 📎.</li><li><b>Suppressions</b> : un utilisateur ne supprime que ce qu'il a lui-même créé, et jamais une contestation acceptée, facturée ou payée ; un administrateur supprime tout (noté dans l'Historique). <b>Archivage</b> (Paramètres) : déplace les contestations payées depuis plus de 6 mois vers des onglets d'archives du Sheet ; leurs montants restent comptés dans les totaux (ligne « Archivé »). <b>Heure</b> : tous les postes s'alignent sur l'heure du serveur à la connexion.</li><li><b>Décisions et comptes</b> : seuls les comptes de grade Juge, Procureur ou Superviseur (et le fondateur) peuvent passer une contestation à « Accepté » ou « Rejetée » ; un magistrat ou un administrateur peut annuler une décision. Dans Comptes, « Désactiver » bloque la connexion ; un compte désactivé propose alors « Réactiver » ou « Supprimer » (suppression définitive, avec confirmation, impossible pour soi-même et pour le fondateur). Seul le fondateur crée, modifie, désactive, supprime ou réinitialise le code d'un compte administrateur.</li><li><b>Historique</b> : journal des actions (qui, quand, quoi), visible par les administrateurs.</li><li><b>Thème</b> : bouton Jour/Nuit en haut à droite.</li></ol>
  <p class="mut">Synchronisation : chaque modification est envoyée au Google Sheet ; les données sont rechargées toutes les minutes.</p></div>`}
};

async function setStatus(id,v){const c=db.contests.find(c=>c.id==id);
  if(DEC.includes(v)&&!canDecide()){toast('⚖ Seuls un juge, un procureur ou un superviseur peuvent rendre une décision');render();return}
  if(DEC.includes(c.status)&&!canUndo()){toast('⚖ Seul un magistrat ou un administrateur peut annuler une décision');render();return}
  if(locked(c)){
    if(role=='user'){toast('🔒 Contestation '+c.pay+' : seul un administrateur peut changer son statut');render();return}
    if(!await dlg({msg:'🔒 Cette contestation est déjà « '+c.pay+' » : une facture a pu être envoyée avec ce montant.\n\nConfirmer le changement de statut ? Il sera noté dans l\'historique.',ok:'Confirmer',danger:false})){render();return}
  }
  if(v=='Rejetée'){askMotif(c.rejet||'',m=>{if(m===null){render();return}c.rejet=m;applyStatus(c,v)});return}
  c.rejet='';applyStatus(c,v)}

  <button class="btn" id="mOk">Valider le rejet</button> <button class="btn g" id="mNo">Annuler</button></div>`;

  if(v===null)return;const n=v.trim();if(!n||n==x.n)return;
  const o=db.ents.find(e=>e.id!=id&&nk(e.n)==nk(n));

  catch(e){if($('#lerr'))$('#lerr').textContent="Connexion impossible : vérifiez l'adresse du serveur et le déploiement du script."}}

    sessionStorage.cs_tok=j.token;FORCE=false;if(j.recovery)RECNEW=j.recovery;if(RECNEW){const c=RECNEW;RECNEW='';showRec(c)}await resume()}
  catch(x){if($('#lerr'))$('#lerr').textContent='Échec : réessayez.'}}
const cliPanel=()=>`<div class="card"><h3>Clients de ${esc(CLI.login)}</h3><p class="mut">Cochez les dossiers (justiciables) que cet avocat pourra consulter. Il ne verra rien d'autre.</p><input placeholder="Filtrer par nom…" oninput="filt('cliT',this.value)" style="margin-bottom:8px">
  <div class="tw" style="max-height:340px;overflow:auto"><table id="cliT"><tr><th>Dossier</th></tr>${db.cases.filter(d=>d.offender&&db.contests.some(c=>c.caseId==d.id)).sort((a,b)=>a.offender.localeCompare(b.offender)).map(d=>`<tr><td><label style="margin:0;color:inherit"><input type="checkbox" value="${d.id}" ${CLI.sel.includes(d.id)?'checked':''} onchange="cliTog(this)"> ${rf(d,'case')} – ${esc(d.offender)}${d.dob?` <span class="mut">· né(e) le ${bd(d.dob)}</span>`:''}</label></td></tr>`).join('')}</table></div>
  <button class="btn" onclick="saveCli()">Enregistrer</button> <button class="btn g" onclick="CLI.login='';render()">Annuler</button></div>`;
function editClients(l){const x=accs.find(a=>a.login==l);CLI={login:l,sel:[...(x.clients||[])]};render();scrollTo(0,0)}
function cliTog(el){const i=CLI.sel.indexOf(el.value);if(el.checked&&i<0)CLI.sel.push(el.value);if(!el.checked&&i>=0)CLI.sel.splice(i,1)}
async function saveCli(){const j=await api({action:'setclients',target:CLI.login,clients:CLI.sel});msg(j);if(j.ok){CLI.login='';loadAcc()}}
function logout(){const tk=sessionStorage.cs_tok;if(tk&&db.cfg.url)fetch(db.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'logout',token:tk})}).catch(()=>{});if(role=='lecteur'||!dirty){wipe();localStorage.setItem('cs_db',JSON.stringify(db))}FORCE=false;role=null;me={};accs=null;jr=null;sessionStorage.removeItem('cs_tok');render()}
function saveCfg(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));db.cfg.court=f.court;db.cfg.url=f.url.trim();toast('Paramètres enregistrés');save();pull()}
async function api(b){const j=await (await fetch(db.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...auth(),...b})})).json();if(j.error=='code'){logout();throw 0}return j}
async function loadAcc(){try{accs=(await api({action:'accounts'})).list||[]}catch(e){accs=[]}render()}
async function loadJr(){try{jr=(await api({action:'journal'})).list||[]}catch(e){jr=[]}render()}
const ERR={invalid:'Données invalides',name:'Prénom et nom de famille obligatoires (lettres)',shortcode:'Le code doit faire 6 caractères minimum',role:'Refusé : droits insuffisants (les comptes administrateurs sont gérés par le fondateur uniquement)',notinactive:"Désactivez d'abord le compte avant de le supprimer",notfound:'Compte introuvable',notlocked:"Ce compte n'est pas bloqué"};
const msg=j=>j.ok&&j.unlocked?toast('Compte débloqué',4000):j.ok&&j.deleted?toast('Compte supprimé définitivement',4000):j.ok&&j.created?toast('Compte créé — identifiant : '+j.login,9000):toast(j.ok?'Compte mis à jour':ERR[j.error]||'Refusé ('+(j.error||'erreur')+')',4000);
const setAccMsg=t=>{ACCMSG=t;const el=$('#accR');if(el){el.textContent=t;el.style.display=t?'':'none'}};
async function saveAcc(e){const f=Object.fromEntries(new FormData($('#accF')));
  if(SRV<6){setAccMsg("⚠ Script Google obsolète : redéployez une nouvelle version avant de créer un compte");return}
  setAccMsg('⏳ Envoi en cours…');
  try{const j=await api({action:'saveaccount',acc:f});
    if(j.ok){setAccMsg(j.created?'✔ Compte créé — identifiant : '+j.login+' (à transmettre avec le code choisi)':'✔ Compte mis à jour : '+j.login);
      if(String(j.login).toLowerCase()==String(sessionStorage.cs_login).toLowerCase()){me.nom=(f.prenom+' '+f.famille).trim();me.grade=f.grade||''}accs=null;await loadAcc();
      if(j.created&&!accs.some(a=>a.login==j.login))setAccMsg("⚠ Compte créé mais introuvable dans la liste : vérifiez l'onglet comptes du Sheet")}
    else setAccMsg('✖ '+(ERR[j.error]||'Erreur du serveur : '+(j.msg||j.error||JSON.stringify(j))))}
  catch(x){setAccMsg('✖ Échec de la requête : '+((x&&x.message)||'vérifiez la connexion et le déploiement du script'))}}
const genLogin=(p,f)=>{const s=v=>nk(v).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');if(!s(p)||!s(f))return '';const b=(s(p)+'.'+s(f)).slice(0,27).replace(/[-.]+$/,'');let id=b,n=2;while((accs||[]).some(a=>String(a.login).toLowerCase()==id))id=b+n++;return id};
function prevLogin(){const f=$('#accF');if(f.login.value)return;$('#accL').value=genLogin(f.prenom.value,f.famille.value)}
async function myProfile(){page='acc';if(accs===null)await loadAcc();else render();const me2=accs.find(a=>String(a.login).toLowerCase()==String(sessionStorage.cs_login).toLowerCase());if(me2)editAcc(me2.login);else toast('Profil introuvable dans la liste des comptes')}
function resetAcc(){const f=$('#accF');f.reset();f.login.value='';$('#accL').value='';$('#accM').textContent="Création d'un nouveau compte";$('#accB').textContent='Créer le compte';$('#accC').style.display='none';f.prenom.focus()}
function editAcc(l){const x=accs.find(a=>a.login==l),f=$('#accF');let p=x.prenom||'',fa=x.famille||'';
  if(!p&&!fa){const w=String(x.nom||'').trim().split(' ');p=w.shift()||'';fa=w.join(' ')}
  f.login.value=x.login;$('#accL').value=x.login;f.prenom.value=p;f.famille.value=fa;f.grade.value=x.grade||'';if(x.role!='fondateur')f.role.value=x.role;f.code.value='';
  $('#accM').textContent='✏ MODIFICATION du compte '+x.login+" (l'identifiant ne change pas) — « Annuler la modification » pour revenir à la création";$('#accB').textContent='Enregistrer les modifications';$('#accC').style.display='';f.prenom.focus();f.scrollIntoView()}
async function delAcc(login){const x=(accs||[]).find(a=>a.login==login)||{};
  if(!await dlg({msg:'Supprimer définitivement le compte « '+login+' »'+(x.nom?' ('+x.nom+')':'')+' ?\n\nCette action est irréversible : le compte, son code et son tampon sont effacés. Les contestations et documents qu\'il a traités sont conservés, et son identifiant ne sera jamais réattribué.\n\nPour seulement empêcher la connexion, utilisez plutôt « Désactiver » / « Réactiver ».',ok:'Supprimer',danger:true}))return;
  msg(await api({action:'deleteaccount',target:login}));loadAcc()}
async function unlockAcc(login){if(SRV<16){toast('⚠ Script Google obsolète : redéployez une nouvelle version');return}msg(await api({action:'unlock',target:login}));loadAcc()}
async function genRec(){if(SRV<16){toast('⚠ Script Google obsolète : redéployez une nouvelle version');return}if(!await dlg({msg:"Générer un nouveau code de déblocage ?\nL'ancien cessera de fonctionner immédiatement.",ok:'Confirmer',danger:false}))return;const j=await api({action:'genrecovery'});if(j.ok){showRec(j.recovery);loadAcc()}else msg(j)}
async function toggleAcc(login){msg(await api({action:'saveaccount',acc:{login,toggle:1}}));loadAcc()}
async function codeAcc(login,role){const code=await dlg({title:'Nouveau code',msg:'Nouveau code pour '+login+' (6 caractères min.).',input:{type:'password',min:6},ok:'Enregistrer'});if(!code)return;msg(await api({action:'saveaccount',acc:{login,role,code,grade:(accs.find(a=>a.login==login)||{}).grade||''}}));loadAcc()}
async function myCode(){const c=await dlg({title:'Mon code',msg:'Nouveau code personnel (6 caractères min.).',input:{type:'password',min:6},ok:'Enregistrer'});if(!c)return;const j=await api({action:'mycode',code2:c});if(j.ok){sessionStorage.cs_tok=j.token;toast('Code modifié');if(j.recovery)showRec(j.recovery)}else toast('Code invalide')}
async function archive(){
  if(SRV<10){toast("⚠ Script Google obsolète : redéployez une nouvelle version");return}
  if(!await dlg({msg:"Archiver les contestations payées depuis plus de 6 mois ? Elles seront déplacées dans les onglets d'archives du Google Sheet et n'apparaîtront plus dans l'application.",ok:'Archiver',danger:false}))return;
  try{const j=await api({action:'archive'});if(!j.ok){toast('Archivage refusé');return}toast(j.n?j.n+' contestation(s) archivée(s)':'Rien à archiver pour le moment');await pull()}catch(e){toast("Échec de l'archivage")}}
function exportJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='cour-supreme-sauvegarde.json';a.click()}
function filtDoc(){const q=$('#dq').value.toLowerCase(),t=$('#dt').value.toLowerCase();
  document.querySelectorAll('#docT tr').forEach((r,i)=>{if(!i)return;const ty=(r.querySelector('span[hidden]')||{textContent:''}).textContent.toLowerCase();r.style.display=r.textContent.toLowerCase().includes(q)&&(!t||ty==t)?'':'none'})}
function filt(id,v){v=v.toLowerCase();document.querySelectorAll('#'+id+' tr').forEach((r,i)=>{if(i)r.style.display=r.textContent.toLowerCase().includes(v)||[...r.querySelectorAll('select')].some(s=>s.value.toLowerCase()==v)?'':'none'})}

function render(){
  if(page!=lastPage){SEL.clear();lastPage=page}
  $('#ttl').textContent='⚖ '+db.cfg.court;
  $('#who').textContent=role?'👤 '+(me.nom||sessionStorage.cs_login)+(me.grade?' · '+me.grade:'')+' ('+RL[role]+')':'';
  $('#prof').style.display=role&&role!='user'&&role!='lecteur'?'':'none';$('#stp').style.display=role&&role!='lecteur'?'':'none';
  const old=role&&role!='lecteur'&&SRV>0&&SRV<19?'<div class="card" style="border:2px solid var(--ko)"><b>⚠ Le script Google n\'est pas à jour.</b> Collez la dernière version du code dans Apps Script, puis Déployer › Gérer les déploiements › Nouvelle version (certaines fonctions — tampons, suppressions, dossiers — ne marcheront pas sinon).</div>':'';
  if(!role){$('#nav').innerHTML='';$('#main').innerHTML=FORCE?forceView():loginView();selBar();return}
  $('#nav').innerHTML=pages.filter(p=>vis(p[0])).map(([k,t])=>`<button class="${k==page?'on':''}" onclick="EDIT=null;page='${k}';render()">${t}</button>`).join('');
  const lec=role=='lecteur',has=db.cases.some(d=>d.offender);
  $('#main').innerHTML=lec&&!has&&page!='help'
    ?`<h2>Aucune affaire en cours</h2><div class="card"><p>Aucune affaire en cours actuellement.</p><p class="mut">Les dossiers de vos clients apparaîtront ici dès qu'ils vous seront attribués. La page se met à jour automatiquement (environ chaque minute).</p><button class="btn g" onclick="pull(true)">Actualiser maintenant</button></div>`
    :old+(lec&&has&&page=='dash'&&!db.contests.some(c=>ST.indexOf(c.status)<2)?'<div class="card">Aucune affaire en cours actuellement : toutes les contestations de vos clients ont été jugées.</div>':'')+P[page]();
  $('#main').className=lec?'ro':'';selBar();
}
migr();render();if(sessionStorage.cs_tok&&db.cfg.url)resume();
</script>
</body>
